name: Python QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: python -m compileall app.py rag workflow llm
      - name: Runtime import smoke
        run: |
          python -c "from workflow.fast_planner import FastPlannerWorkflow; from rag.fast_retriever import CachedSpotRetriever; print('runtime imports ok')"
      - run: python -m pytest -q
